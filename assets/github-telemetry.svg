<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Arslaan's GitHub activity snapshot</title>
  <desc id="description">A matte-black GitHub-style activity card showing 2,292 total contributions, 457 contributions in the last year, 66 public repositories, and 2 followers.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <pattern id="noise-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#30363D" stroke-opacity="0.34"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="12" fill="#010409"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="11.5" stroke="#30363D"/>
  <rect x="1" y="1" width="1198" height="54" rx="11" fill="url(#header)"/>
  <path d="M1 54.5H1199" stroke="#30363D"/>
  <rect x="1" y="55" width="1198" height="204" fill="url(#noise-grid)" opacity="0.28"/>
  <circle cx="32" cy="28" r="6" fill="#3FB950"/>
  <text x="48" y="33" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">GITHUB_TELEMETRY</text>
  <text x="1165" y="33" fill="#8B949E" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1">PROFILE SNAPSHOT</text>
  <path d="M300 78V228M600 78V228M900 78V228" stroke="#30363D"/>
  <g transform="translate(0 0)">
    <text x="150" y="143" fill="#F0F6FC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="38" font-weight="700">2,292</text>
    <text x="150" y="175" fill="#8B949E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="1">TOTAL CONTRIBUTIONS</text>
    <rect x="117" y="196" width="66" height="4" rx="2" fill="#238636"/>
  </g>
  <g transform="translate(300 0)">
    <text x="150" y="143" fill="#F0F6FC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="38" font-weight="700">457</text>
    <text x="150" y="175" fill="#8B949E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="1">LAST 12 MONTHS</text>
    <rect x="117" y="196" width="66" height="4" rx="2" fill="#58A6FF"/>
  </g>
  <g transform="translate(600 0)">
    <text x="150" y="143" fill="#F0F6FC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="38" font-weight="700">66</text>
    <text x="150" y="175" fill="#8B949E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="1">PUBLIC REPOSITORIES</text>
    <rect x="117" y="196" width="66" height="4" rx="2" fill="#A371F7"/>
  </g>
  <g transform="translate(900 0)">
    <text x="150" y="143" fill="#F0F6FC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="38" font-weight="700">2</text>
    <text x="150" y="175" fill="#8B949E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="1">FOLLOWERS</text>
    <rect x="117" y="196" width="66" height="4" rx="2" fill="#D29922"/>
  </g>
</svg>
